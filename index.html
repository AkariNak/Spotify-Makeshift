<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0D16">
<title>Side B</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script defer src="config.js"></script>
<script defer src="util.js"></script>
<script defer src="library.js"></script>
<script defer src="colorwheel.js"></script>
<script defer src="app.js"></script>
</head>
<body>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Library">
    <div class="side-top">
      <div class="brand">
        <svg class="reel" viewBox="0 0 30 20" aria-hidden="true">
          <rect x="1" y="1" width="28" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle class="hub" cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 2"/>
          <circle class="hub" cx="20" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 2"/>
        </svg>
        <span id="brandName">Side B</span>
      </div>
    </div>
    <div class="side-head">
      <span>Your library</span>
      <button class="ib small" id="addBtnSide" type="button" aria-label="Add songs from this device" data-icon="plus"></button>
    </div>
    <ul class="lib-list" id="libList"></ul>
    <div class="side-foot">
      <p>Covers you pick are saved in this browser. Export them and upload <code>covers.json</code> to your repo to see them on every device.</p>
      <button class="pill small" id="exportBtn" type="button">Export covers</button>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div class="main-inner">
      <div class="topbar" id="topbar">
        <button class="ib menu" id="menuBtn" type="button" aria-label="Open library" data-icon="menu"></button>
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Search songs, artists, albums" aria-label="Search" autocomplete="off">
        </label>
        <div class="topbar-right">
          <button class="ib add-top" id="addBtnTop" type="button" aria-label="Add songs from this device" data-icon="plus"></button>
          <div class="theme-pick">
            <button class="ib" id="themeBtn" type="button" aria-label="Theme" aria-haspopup="true" aria-expanded="false" data-icon="sliders"></button>
            <div class="theme-menu" id="themeMenu" role="menu" aria-label="Theme" hidden></div>
          </div>
        </div>
      </div>

      <header class="hero">
        <div class="hero-cover" id="heroCover"></div>
        <div class="hero-text">
          <span class="hero-kind" id="heroKind">Collection</span>
          <h1 class="hero-title" id="heroTitle">All songs</h1>
          <p class="hero-meta" id="heroMeta">Loading…</p>
        </div>
      </header>

      <div class="actions">
        <button class="big-play" id="heroPlay" type="button" aria-label="Play" data-icon="play" disabled></button>
        <button class="ib big" id="heroShuffle" type="button" aria-label="Shuffle play" data-icon="shuffle" disabled></button>
      </div>

      <div class="table">
        <div class="thead" aria-hidden="true">
          <span class="c-num">#</span>
          <span>Title</span>
          <span class="c-album">Album</span>
          <span class="c-time" data-icon="clock"></span>
          <span></span>
        </div>
        <ol class="tracks" id="tracks"></ol>
        <div class="empty" id="empty" hidden></div>
      </div>
    </div>
  </main>
</div>

<section class="stage" id="stage" aria-label="Now playing">
  <div class="stage-bg" id="stageBg"></div>
  <button class="ib stage-close" id="stageClose" type="button" aria-label="Close now playing" data-icon="down"></button>
  <div class="stage-inner">
    <div class="art" id="bigArt" role="img" aria-label="Cover"></div>
    <div class="stage-meta">
      <div class="stage-text">
        <h2 class="stage-title" id="stageTitle">Nothing playing</h2>
        <p class="stage-artist" id="stageArtist"></p>
      </div>
      <button class="ib" id="stageCoverBtn" type="button" aria-label="Change cover" data-icon="palette"></button>
    </div>
  </div>
</section>

<footer class="bar" id="bar">
  <div class="bar-progress" aria-hidden="true"></div>
  <div class="now">
    <button class="now-btn" id="nowBtn" type="button" aria-label="Open now playing">
      <span class="mini-art" id="miniArt"></span>
      <span class="now-text">
        <span class="now-title" id="nowTitle">Nothing playing</span>
        <span class="now-artist" id="nowArtist">Pick a song to start</span>
      </span>
    </button>
    <button class="ib small now-cover" id="nowCoverBtn" type="button" aria-label="Change cover" data-icon="palette" hidden></button>
  </div>

  <div class="controls">
    <div class="buttons">
      <button class="ib shuffle" id="shuffleBtn" type="button" aria-label="Shuffle off" aria-pressed="false" data-icon="shuffle"></button>
      <button class="ib prev" id="prevBtn" type="button" aria-label="Previous" data-icon="prev"></button>
      <button class="ib play" id="playBtn" type="button" aria-label="Play" data-icon="play"></button>
      <button class="ib next" id="nextBtn" type="button" aria-label="Next" data-icon="next"></button>
      <button class="ib repeat" id="repeatBtn" type="button" aria-label="Repeat off" aria-pressed="false" data-icon="repeat"></button>
    </div>
    <div class="seek">
      <span id="curTime">0:00</span>
      <input id="seekBar" class="range" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <span id="durTime">0:00</span>
    </div>
  </div>

  <div class="vol">
    <button class="ib" id="muteBtn" type="button" aria-label="Mute" data-icon="vol"></button>
    <input id="volBar" class="range" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
  </div>
</footer>

<dialog class="cd" id="coverDialog" aria-labelledby="cdTitle">
  <div class="cd-head">
    <h2 id="cdTitle">Cover</h2>
    <button class="ib" id="cdClose" type="button" aria-label="Close" data-icon="close"></button>
  </div>
  <div class="cd-body">
    <div class="cd-preview" id="cdPreview"></div>
    <div class="cd-controls">
      <div class="seg" role="group" aria-label="Cover style">
        <button type="button" data-mode="solid" aria-pressed="true">Solid</button>
        <button type="button" data-mode="gradient" aria-pressed="false">Gradient</button>
      </div>
      <div class="stops" id="cdStops">
        <button class="stop" type="button" data-stop="0" aria-pressed="true"><span class="sw"></span>Color 1</button>
        <button class="stop" type="button" data-stop="1" aria-pressed="false"><span class="sw"></span>Color 2</button>
      </div>
      <div id="wheel"></div>
      <label class="cd-angle" id="cdAngleRow">
        <span>Direction</span>
        <input id="cdAngle" class="range" type="range" min="0" max="360" step="5" value="135">
        <span id="cdAngleVal">135°</span>
      </label>
      <label class="cd-check" id="cdAlbumRow">
        <input id="cdAlbum" type="checkbox">
        <span>Use for every song in <span id="cdAlbumName"></span></span>
      </label>
    </div>
  </div>
  <div class="cd-foot">
    <div class="cd-links">
      <button class="link" id="cdReset" type="button">Use original art</button>
      <button class="link" id="cdRemove" type="button">Remove song from this device</button>
    </div>
    <button class="pill" id="cdCancel" type="button">Cancel</button>
    <button class="pill primary" id="cdSave" type="button">Save cover</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop" aria-hidden="true">Drop songs to play them now</div>
<input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" multiple hidden>
<audio id="audio" preload="metadata"></audio>
</body>
</html>
